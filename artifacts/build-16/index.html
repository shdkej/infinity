<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f4f0e7"><title>Frame — Instagram Story Maker</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./overrides.css">
</head>
<body><main class="app-shell">
<header class="topbar"><a class="brand" href="./" aria-label="Frame home"><span class="brand-mark">F</span><span>frame</span></a><div class="topbar-center"><span class="live-dot"></span><span id="assetStatus">샘플 캔버스 · 로컬 처리</span></div><span class="format-pill">STORY / 9:16</span></header>
<section class="hero-copy" aria-labelledby="pageTitle"><p class="kicker">01 — INSTAGRAM STORY MAKER</p><h1 id="pageTitle">사진을 올리면,<br><em>스토리 한 장.</em></h1><p class="lede">사진과 문장을 고르고 바로 저장하세요.<br>내 사진은 이 브라우저 안에서만 처리됩니다.</p><button id="heroUpload" class="hero-cta" type="button" onclick="document.querySelector('#assetInput').click()">사진을 올려 스토리 만들기 <span>↗</span></button></section>
<section class="workspace">
<section class="preview-column" aria-label="미리보기"><div class="preview-heading"><div><span class="kicker">LIVE PREVIEW</span><strong id="templateLabel">Photo Hook</strong></div><span>1080 × 1920</span></div><div class="stage-wrap"><div class="stage-ambient"></div><canvas id="previewCanvas" width="1080" height="1920" aria-label="콘텐츠 미리보기"></canvas><div id="emptyState" class="empty-state"><span>+</span><strong>사진을 올려보세요</strong><small>샘플이 준비되어 있습니다</small></div></div><div class="preview-footer"><span>사진과 텍스트는 이 브라우저 안에서만 처리됩니다.</span><span class="key-hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 템플릿</span></div></section>
<aside class="editor-panel" aria-label="콘텐츠 설정"><div class="panel-head"><span class="kicker">MAKE IT YOURS</span><span class="step-count">3 steps</span></div>
<div class="editor-step"><div class="step-title"><span>01</span><h2>사진을 올려요</h2></div><label class="upload-card" for="assetInput"><span class="upload-symbol">↥</span><span><strong>사진을 올려 스토리 만들기</strong><small>JPG · PNG · WebP · MP4</small></span><span class="arrow">↗</span></label><input id="assetInput" type="file" accept="image/*,video/*" hidden></div>
<div class="editor-step"><div class="step-title"><span>02</span><h2>분위기를 고릅니다</h2></div><div class="template-list" role="radiogroup" aria-label="템플릿"><button class="template-card is-selected" data-template="photo" role="radio" aria-checked="true"><span class="mini-preview mini-photo"></span><span><strong>Photo Hook</strong><small>사진 위에 크게</small></span><kbd>1</kbd></button><button class="template-card" data-template="shade" role="radio" aria-checked="false"><span class="mini-preview mini-shade"></span><span><strong>Soft Shade</strong><small>빛을 남기는 자막</small></span><kbd>2</kbd></button><button class="template-card" data-template="editorial" role="radio" aria-checked="false"><span class="mini-preview mini-editorial"></span><span><strong>Editorial</strong><small>정제된 카드</small></span><kbd>3</kbd></button></div></div>
<div class="editor-step copy-step"><div class="step-title"><span>03</span><h2>한 문장을 남겨요</h2></div><label class="field-label" for="headline">큰 문구 <span>최대 3줄</span></label><textarea id="headline" rows="2">이스탄불에서 오래 남은 건&#10;그날의 빛이었습니다</textarea><label class="field-label" for="caption">작은 문구 <span>선택</span></label><textarea id="caption" rows="2">그날의 빛은 사라졌지만,&#10;기억은 오래 남았습니다.</textarea><div class="field-row"><div><label class="field-label" for="fontSelect">폰트</label><select id="fontSelect"><option value="a2z">에이투지체 Black</option><option value="chosun">조선굴림체</option><option value="nanum">나눔스퀘어 네오</option></select></div><div><label class="field-label" for="positionSelect">위치</label><select id="positionSelect"><option value="top">위</option><option value="center" selected>가운데</option><option value="bottom">아래</option></select></div></div></div>
<div class="export-bar"><button id="exportPng" class="button button-primary">PNG로 저장 <span>↗</span></button><button id="exportVideo" class="button button-secondary">영상 <span>↗</span></button></div></aside></section></main><script src="./app.js"></script></body></html>
