<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <title>02 / EVIDENCE — closed-loop experiment</title>
  <desc>Exact circle center (540,650), radius 260; three equal 120 degree clockwise arcs and tangent-derived arrowheads.</desc>
  <rect width="1080" height="1350" fill="#ffffff"/>
  <g fill="#111111" font-family="Noto Sans CJK KR, Pretendard, sans-serif">
    <text x="96" y="126" font-family="ui-monospace, monospace" font-size="18px" font-weight="600" letter-spacing="3px">02 / EVIDENCE</text>
    <text x="96" y="210" font-size="47px" font-weight="700"><tspan x="96" dy="0">써본 것, 안 쓴 것,</tspan><tspan x="96" dy="66">다시 챙길 것을 기록합니다.</tspan></text>
    <line x1="96" y1="310" x2="984" y2="310" stroke="#111111" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#111111" stroke-width="32" stroke-linecap="butt" stroke-linejoin="round"><path d="M 800.000000 650.000000 A 260 260 0 0 1 410.000000 875.166605" /><path d="M 410.000000 875.166605 A 260 260 0 0 1 410.000000 424.833395" /><path d="M 410.000000 424.833395 A 260 260 0 0 1 800.000000 650.000000" /></g>
  <g fill="#111111"><polygon points="410.000000,875.166605 428.444864,911.219164 450.444864,873.114046" /><polygon points="410.000000,424.833395 369.555136,422.780836 391.555136,460.885954" /><polygon points="800.000000,650.000000 822.000000,616.000000 778.000000,616.000000" /></g>
  <g fill="#111111" font-family="Noto Sans CJK KR, Pretendard, sans-serif">
    <text x="96" y="1010" font-size="18px" font-weight="600" letter-spacing="2px">CLOSED LOOP / EVIDENCE</text>
    <text x="96" y="1092" font-size="25px" font-weight="400"><tspan x="96" dy="0">사용한 장면과 불편했던 순간을</tspan><tspan x="96" dy="38">다음 선택의 근거로 남깁니다.</tspan></text>
  </g>
  <line x1="96" y1="1212" x2="984" y2="1212" stroke="#111111" stroke-width="2"/>
  <text x="984" y="1250" text-anchor="end" fill="#111111" font-family="ui-monospace, monospace" font-size="16px">SAM SAMUEL</text>
</svg>