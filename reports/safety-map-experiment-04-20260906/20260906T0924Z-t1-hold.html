  <h1>로마 공식 데이터 검증 · T1 보류</h1>
  <section class="axis ax1"><h2>결론 1: 데이터 표시 보류</h2><p>공식 후보는 2022년 도로교통사고 집계로, 현재 치안 상태를 주장할 근거가 아닙니다.</p></section>
  <section class="axis ax2"><h2>결론 2: no-render 유지</h2><p>검증된 로마 관할 공식 원문과 독립 Red 재검증 전에는 수치·레이어·안전 판단을 표시하지 않습니다.</p></section>
  <details><summary>근거와 다음 조건</summary><p>기관성·라이선스·관측 범위·갱신일은 T1 artifact에 기록했습니다. 재개에는 라이선스, 공간/시간 단위, 결측, 발행·갱신일, 현재성이 함께 확인되는 공식 공공안전 원문이 필요합니다.</p></details>
