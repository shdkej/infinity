<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  Infinity 최종 보고 양식 v2 — "결론 2축 + 접기"
  - 원칙: 결론(2축)은 맨 위에 큼직하게, 상세/메타/로그는 <details>로 접는다.
  - <details>는 JS 없이 동작하므로 대시보드 iframe(sandbox=allow-same-origin)에서도 펼침이 된다.
  - 작업 유형별 2축 라벨:
      research/wiki/doc : 🔍 무엇을 조사/작성했나   → 📊 핵심 결과
      marketing/product/dev/build : 🔴 무엇이 문제였나 → ✅ 어떻게 해결하나
      monitor : 🟡 무엇을 점검했나 → ✅ 이상 여부
  - {{...}} 자리표시자를 치환해 reports/{id}/{timestamp}.html 로 저장한다. (_로 시작하면 대시보드가 무시)
-->
<title>Infinity Report</title>
<style>
  :root {
    --bg:#0f172a; --panel:#1e293b; --panel-2:#273449;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --line:#334155;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:18px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; font-size:14px;
  }
  .report { max-width:820px; margin:0 auto; }
  .head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .id { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--accent); }
  h1 { font-size:18px; margin:0; flex:1 1 auto; }
  .badge { display:inline-block; padding:2px 10px; border-radius:6px; font-size:12px; font-weight:600; }
  .badge.ok{background:#14532d;color:#bbf7d0;} .badge.warn{background:#78350f;color:#fde68a;} .badge.bad{background:#7f1d1d;color:#fecaca;}

  /* 결론 2축 — 가장 크고 눈에 먼저 들어오게 */
  .verdict { display:grid; gap:12px; margin-bottom:16px; }
  .axis { border-left:3px solid var(--line); padding:2px 0 2px 14px; }
  .axis.problem { border-color:var(--bad); }
  .axis.result  { border-color:var(--ok); }
  .axis .label { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  .axis .body  { font-size:16px; line-height:1.5; }
  .axis .body b { color:#fff; }

  /* 상세는 접어둔다 */
  details { background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; }
  summary { cursor:pointer; padding:11px 14px; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸ "; color:var(--accent); }
  details[open] summary::before { content:"▾ "; }
  .details-body { padding:0 16px 14px; }
  ul { margin:6px 0; padding-left:20px; } li { margin:3px 0; }
  code { font-family:ui-monospace,Menlo,monospace; font-size:12px; background:var(--panel-2); padding:1px 6px; border-radius:4px; color:#cbd5e1; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:11px; color:var(--muted); }
  .foot { color:var(--muted); font-size:11px; text-align:center; margin-top:16px; }
</style>
</head>
<body>
<div class="report">

  <div class="head">
    <span class="id">{{ID}}</span>
    <h1>{{TITLE}}</h1>
    <span class="badge ok">{{STATUS}}</span>
  </div>

  <div class="verdict">
    <div class="axis problem">
      <div class="label">{{AXIS1_LABEL}}</div>
      <div class="body">{{AXIS1_BODY}}</div>
    </div>
    <div class="axis result">
      <div class="label">{{AXIS2_LABEL}}</div>
      <div class="body">{{AXIS2_BODY}}</div>
    </div>
  </div>

  <details>
    <summary>상세 — 수행한 작업 / 산출물</summary>
    <div class="details-body">
      <ul>
        <li>{{DETAIL_1}}</li>
        <li>산출물: <code>{{ARTIFACT_PATH}}</code></li>
      </ul>
    </div>
  </details>

  <details>
    <summary>실행 메타 / 다음 액션</summary>
    <div class="details-body">
      <div class="meta">
        <span class="chip">시각 {{TIMESTAMP}}</span>
        <span class="chip">트리거 {{TRIGGER}}</span>
        <span class="chip">{{STATUS_BEFORE}} → {{STATUS_AFTER}}</span>
      </div>
      <ul><li>{{NEXT_ACTION}}</li></ul>
    </div>
  </details>

  <div class="foot">Agent-First Heartbeat · Infinity</div>
</div>
</body>
</html>
