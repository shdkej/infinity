<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  Infinity 보고 양식 — "Quiet Note" 디자인 시스템 (결론 2축 + 접기)
  ────────────────────────────────────────────────────────────
  제약: 대시보드 iframe(sandbox=allow-same-origin)에서 렌더 → JS·외부 리소스 금지, 인라인 CSS만.
  접기는 <details>(JS 불필요). {{...}} 자리표시자를 치환해 reports/{id}/{timestamp}.html 로 저장.

  ▷ 카테고리별 색: :root 의 --a1/--a1-deep 두 줄만 교체한다. (축2는 항상 sage 고정)
     · 조사형 (research/wiki/doc)            : --a1:#5a6f8a; --a1-deep:#3f536e;  (slate-blue)  라벨 "무엇을 조사했나 / 핵심 결과"
     · 개선형 (marketing/product/dev/build/pages): --a1:#a9745a; --a1-deep:#8a5c45;  (clay)        라벨 "무엇이 문제였나 / 어떻게 해결하나"
     · 감시형 (monitor/maintenance/router)   : --a1:#b08545; --a1-deep:#8a6633;  (muted gold)  라벨 "무엇을 점검했나 / 이상 여부·조치"
-->
<title>Infinity Report</title>
<style>
  :root{
    --bg:#f4f2ea; --panel:#fbfaf5; --ink:#2c2a25; --soft:#807c70; --faint:#a8a496; --line:#e3dfd2;
    --a2:#5f7a5e; --a2-deep:#3f5740;            /* 축2(결과/해법/조치) = sage, 고정 */
    --a1:#5a6f8a; --a1-deep:#3f536e;            /* 축1 = 카테고리색 (기본: 조사형 slate-blue) */
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.68; -webkit-font-smoothing:antialiased;}
  .sheet{max-width:720px; margin:0 auto; padding:48px 34px 46px;}
  .reveal{opacity:0; animation:fade .7s ease forwards;}
  @keyframes fade{from{opacity:0; transform:translateY(9px);} to{opacity:1; transform:none;}}

  .eyebrow{display:flex; align-items:center; gap:10px; font-family:var(--mono);
    font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--soft);}
  .eyebrow .id{color:var(--a2-deep); font-weight:600;}
  .eyebrow .dot{width:5px; height:5px; border-radius:50%; background:var(--a2);}
  .eyebrow .status{margin-left:auto; color:var(--a2-deep);}
  h1{font-size:29px; line-height:1.3; font-weight:700; letter-spacing:-.01em; margin:20px 0 0;}
  .dek{font-size:15.5px; color:var(--soft); margin:13px 0 0; max-width:52ch;}
  .hr{height:1px; background:var(--line); margin:30px 0;}

  .axis{padding:0 0 4px 22px; position:relative; margin-bottom:30px;}
  .axis::before{content:""; position:absolute; left:0; top:6px; bottom:6px; width:2px; border-radius:2px;}
  .axis.ax1::before{background:var(--a1);} .axis.ax2::before{background:var(--a2);}
  .axis.ax1{--ul:var(--a1);} .axis.ax2{--ul:var(--a2);}
  .axis .label{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    margin-bottom:9px; display:flex; align-items:center; gap:8px;}
  .axis.ax1 .label{color:var(--a1-deep);} .axis.ax2 .label{color:var(--a2-deep);}
  .axis .label .n{font-weight:600; opacity:.6;}
  .axis .text{font-size:18px; line-height:1.6; color:#37352e;}
  .axis .text b{font-weight:700; color:var(--ink); border-bottom:2px solid var(--ul);}
  ol.find{list-style:none; counter-reset:f; margin:16px 0 0; padding:0;}
  ol.find li{position:relative; padding:8px 0 8px 26px; font-size:15px; color:#37352e; border-top:1px solid var(--line);}
  ol.find li:first-child{border-top:none;}
  ol.find li::before{counter-increment:f; content:counter(f); position:absolute; left:0; top:9px;
    font-family:var(--mono); font-size:12px; font-weight:600; color:var(--a1-deep);}

  details{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin-bottom:10px;}
  summary{cursor:pointer; list-style:none; padding:14px 16px; display:flex; align-items:center; gap:11px;
    font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--soft);}
  summary::-webkit-details-marker{display:none;}
  summary .chev{width:8px; height:8px; border-right:2px solid var(--a2-deep); border-bottom:2px solid var(--a2-deep);
    transform:rotate(-45deg); transition:.25s; flex:none; margin-left:2px;}
  details[open] summary .chev{transform:rotate(45deg);}
  summary:hover{color:var(--ink);}
  .body{padding:2px 16px 18px;}
  table{border-collapse:collapse; width:100%; font-size:13px; margin:4px 0 12px;}
  th,td{border-bottom:1px solid var(--line); padding:9px 11px; text-align:left; vertical-align:top;}
  th{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); font-weight:600;}
  td:first-child{color:var(--a2-deep); font-weight:600; white-space:nowrap;}
  .body p{color:var(--soft);}
  .body ul{margin:6px 0; padding-left:18px;} .body li{margin:5px 0;}
  code{font-family:var(--mono); font-size:12px; background:#edeae0; padding:1px 6px; border-radius:3px; color:var(--a2-deep);}
  a{color:var(--a2-deep); text-underline-offset:3px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .chip{font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; color:var(--soft); border:1px solid var(--line); border-radius:999px; padding:3px 10px;}
  .foot{margin-top:30px; padding-top:15px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px;
    letter-spacing:.13em; text-transform:uppercase; color:var(--faint);}
</style>
</head>
<body>
<div class="sheet">

  <div class="eyebrow reveal">
    <span class="dot"></span>
    <span class="id">{{ID}}</span>
    <span>Research Note</span>
    <span class="status">{{STATUS}}</span>
  </div>
  <h1 class="reveal" style="animation-delay:.05s">{{TITLE}}</h1>
  <p class="dek reveal" style="animation-delay:.09s">{{DEK}}</p>

  <div class="hr reveal" style="animation-delay:.12s"></div>

  <div class="axis ax1 reveal" style="animation-delay:.16s">
    <div class="label"><span class="n">01</span> {{AXIS1_LABEL}}</div>
    <div class="text">{{AXIS1_BODY}}</div>
  </div>

  <div class="axis ax2 reveal" style="animation-delay:.22s">
    <div class="label"><span class="n">02</span> {{AXIS2_LABEL}}</div>
    <div class="text">{{AXIS2_BODY}}</div>
    <!-- 선택: 핵심 항목 나열
    <ol class="find"><li>...</li></ol> -->
  </div>

  <div class="reveal" style="animation-delay:.27s">
  <details open>
    <summary><span class="chev"></span> {{DETAIL_TITLE}}</summary>
    <div class="body">{{DETAIL_BODY}}</div>
  </details>

  <details>
    <summary><span class="chev"></span> 실행 메타 · 산출물</summary>
    <div class="body">
      <div class="chips">
        <span class="chip">{{TIMESTAMP}}</span>
        <span class="chip">{{TRIGGER}}</span>
        <span class="chip">{{STATUS_BEFORE}} → {{STATUS_AFTER}}</span>
      </div>
      <ul><li>산출물 <code>{{ARTIFACT_PATH}}</code></li></ul>
    </div>
  </details>
  </div>

  <div class="foot reveal" style="animation-delay:.3s">
    <span>Agent-First Heartbeat</span>
    <span>Infinity · Intent Note</span>
  </div>
</div>
</body>
</html>
