name: Heartbeat Telegram Notify

on:
  workflow_dispatch:
  # 아침 8시 리캡 보장 — no-op Heartbeat는 더 이상 커밋하지 않으므로
  # push에 의존하지 않고 독립 스케줄로 깨운다. KST 08:00 = UTC 23:00.
  schedule:
    - cron: '0 23 * * *'
  push:
    paths:
      - 'reports/**'
      - 'INTENTS.md'
      - 'GATES.md'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # recap(schedule)은 24시간 git log가 필요하고, normal은 HEAD~1 diff가 필요하다.
          fetch-depth: 0

      - name: Check time and mode (KST)
        id: time_check
        run: |
          KST_HOUR=$(TZ=Asia/Seoul date +%H)
          if [ "$KST_HOUR" -lt 8 ] || [ "$KST_HOUR" -ge 22 ]; then
            echo "mode=quiet" >> "$GITHUB_OUTPUT"
            echo "Quiet hours (KST ${KST_HOUR}시). Skipping."
          elif [ "$KST_HOUR" -eq 8 ]; then
            echo "mode=recap" >> "$GITHUB_OUTPUT"
            echo "Morning recap time."
          else
            echo "mode=normal" >> "$GITHUB_OUTPUT"
          fi

      - name: Morning recap (KST 08시)
        if: steps.time_check.outputs.mode == 'recap'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 최근 24시간 Infinity 처리 커밋 요약.
          # 커밋 author는 로컬 Claude/웹/수동 push 경로에 따라 shdkej 등으로 남을 수 있으므로
          # author가 아니라 Infinity 운영 파일 경로를 기준으로 집계한다.
          SINCE=$(TZ=Asia/Seoul date -d '24 hours ago' --iso-8601=seconds 2>/dev/null || date -v-24H '+%Y-%m-%dT%H:%M:%S')
          COMMITS=$(git log --since="$SINCE" --oneline -- reports/ INTENTS.md GATES.md)
          COMMIT_COUNT=$(echo "$COMMITS" | grep -c . || true)

          # 현재 INTENTS.md Active 상태
          ACTIVE=$(grep -A1 "^## Active" INTENTS.md | tail -1)

          # 현재 GATES.md 대기 중
          PENDING=$(sed -n '/^## 대기 중/,/^## /p' GATES.md | grep -c "^###" || true)

          MSG=$(printf "☀️ 아침 리캡 (최근 24시간)\n\nInfinity 처리 활동: %s건\n승인 대기: %s건\n\n--- 커밋 이력 ---\n%s" "$COMMIT_COUNT" "$PENDING" "$COMMITS")

          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            > /dev/null 2>&1

          echo "Morning recap sent"

      - name: Normal notification
        if: steps.time_check.outputs.mode == 'normal'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 첫 커밋 등 부모가 없으면 비교 대상이 없으므로 조용히 종료
          if git rev-parse --verify -q HEAD~1 >/dev/null; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- reports/ INTENTS.md GATES.md)
          else
            CHANGED=""
          fi

          if [ -z "$CHANGED" ]; then
            echo "No relevant changes"
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B)

          # 1순위: 표준 noop 마커 — heartbeat.md 규칙으로 강제. 표현 흔들림에 영향받지 않음
          if printf '%s' "$COMMIT_MSG" | grep -qF "[noop]"; then
            echo "Skip: [noop] marker"
            exit 0
          fi

          # 2순위(fallback): 마커 누락 대비 무의미 키워드. 대소문자 무시(-i)로 Active/active 흡수
          if printf '%s' "$COMMIT_MSG" | grep -iqE "조용한 종료|무변화|no-?op|비어[ ]?있음|Intent 없음|active 없음|처리할 Intent 없음|변화 없음|no activity|nothing to do"; then
            echo "Skip: no-op heartbeat commit (keyword fallback)"
            exit 0
          fi

          REPORT=$(echo "$CHANGED" | grep 'reports/' | head -1)
          HAS_GATES=$(echo "$CHANGED" | grep -c '^GATES.md$' || true)

          # Marketing work is noisy if the user gets both:
          # 1) "Heartbeat Update" for candidate/inbox routing, and
          # 2) a later completion report for the actual work.
          #
          # For marketing-only INTENTS.md updates, keep the commit/push as the
          # queue source of truth but suppress the Telegram notice. Completion,
          # blocker, approval, and report notifications still go through.
          if [ -z "$REPORT" ] && [ "$HAS_GATES" -eq 0 ]; then
            if echo "$CHANGED" | grep -qx 'INTENTS.md' && printf '%s' "$COMMIT_MSG" | grep -iqE 'marketing|세스고딘|growth'; then
              echo "Skip: marketing candidate-only intent update"
              exit 0
            fi
          fi

          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            # 리포트에 actions_taken 항목이 비어있으면 스킵
            if grep -qE "actions_taken:\s*\[\]|actions_taken:\s*$|수행 액션:\s*0건|actions_taken:\s*없음" "$REPORT"; then
              echo "Skip: report has no actions"
              exit 0
            fi
            # 리포트는 .html 이므로 태그/CSS를 그대로 보내면 안 된다.
            # 태그를 벗겨 제목 + 결론 2축만 읽히는 텍스트로 추출한다.
            CONTENT=$(python3 scripts/html_report_to_text.py "$REPORT")
            MSG=$(printf '🤖 Heartbeat Report\n\n%s' "$CONTENT")
          else
            MSG=$(printf '🤖 Heartbeat Update\n\n%s' "$COMMIT_MSG")
          fi

          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            > /dev/null 2>&1

          echo "Notification sent"
